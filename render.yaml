databases:
  - name: paid-link-db
    plan: basic-256mb
    databaseName: paid_link
    user: paid_link

services:
  - type: web
    name: paid-link-api
    plan: starter
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: paid-link-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://paid-link-web.onrender.com
      - key: CORS_ALLOW_CREDENTIALS
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://paid-link-api.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: paid-link-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: MPESA_B2C_INITIATOR_NAME
        sync: false
      - key: MPESA_B2C_SECURITY_CREDENTIAL
        sync: false
      - key: MPESA_B2C_SHORTCODE
        sync: false
      - key: MPESA_B2C_RESULT_URL
        sync: false
      - key: MPESA_B2C_TIMEOUT_URL
        sync: false
      - key: MPESA_B2C_RECONCILIATION_URL
        sync: false

  - type: web
    name: paid-link-web
    runtime: static
    rootDir: frontend/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://paid-link-api.onrender.com
