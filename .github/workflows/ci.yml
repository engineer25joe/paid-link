name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paid_link
          POSTGRES_USER: paid_link
          POSTGRES_PASSWORD: paid_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paid_link -d paid_link"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Run Django tests (excluding payment integrations)
        env:
          DATABASE_URL: postgresql://paid_link:paid_link@localhost:5432/paid_link
          SECRET_KEY: ci-only-not-a-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          SECURE_SSL_REDIRECT: "False"
          SECURE_HSTS_SECONDS: "0"
        run: python manage.py test accounts content purchases
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - name: Build production web app
        env:
          VITE_API_BASE_URL: https://paid-link-api.onrender.com
        run: npm run build
        working-directory: frontend/web

  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
        working-directory: frontend/mobile
      - name: Check Expo SDK compatibility
        run: npx expo-doctor
        working-directory: frontend/mobile
      - name: Check Expo package versions
        run: npx expo install --check
        working-directory: frontend/mobile
