name: Paid Link backend keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed backend health
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = os.environ.get("BACKEND_HEALTH_URL", "").strip()
          if not url:
              raise SystemExit("Repository Actions variable BACKEND_HEALTH_URL is not configured")

          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  body = json.load(response)
                  if response.status != 200 or body.get("status") != "ok":
                      raise SystemExit(f"Backend health check failed: HTTP {response.status}, unexpected response")
          except (urllib.error.URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Backend health check failed: {error}") from error

          print("Backend health check passed")
          PY
      - name: Report health check failure
        if: failure()
        run: echo "::error::Paid Link backend health check failed. Review the preceding request output and verify BACKEND_HEALTH_URL and API health."
